[project]
name = "modal-notebook-studio"
version = "0.1.0"
description = "A multi-user JupyterLab workspace with per-user Modal accounts and Volumes."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.12,<1",
  "cryptography>=41,<46",
  "httpx>=0.27,<1",
]

[project.scripts]
notebook-studio-user = "notebook_studio.admin:main"
notebook-studio = "notebook_studio.cli:main"
notebook-studio-mcp = "notebook_studio.mcp_server:main"

[project.optional-dependencies]
modal = ["modal>=1.0,<2"]
mcp = ["mcp>=2.0,<3"]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100


[tool.setuptools.packages.find]
include = ["notebook_studio*"]
exclude = ["tests*", "worker*", "data*"]

[tool.setuptools.package-data]
notebook_studio = ["web/*.html", "web/static/*"]
